<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Activity Console — live design harness</title>
    <style>
      html, body { height: 100%; margin: 0; background: #141416; color: #f0f0f1;
        font-family: ui-monospace, "SF Mono", Menlo, monospace; }
      body { display: flex; flex-direction: column; }
      .bar { flex: 0 0 auto; display: flex; align-items: center; gap: 12px;
        padding: 6px 12px; font-size: 11px; border-bottom: 1px solid rgba(255,255,255,.08);
        background: #1b1b1e; }
      .bar .t { font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: #9d9d9f; }
      .bar .note { color: #737375; }
      .bar #toggle { margin-left: auto; font: inherit; color: #f0f0f1; cursor: pointer;
        background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.12);
        border-radius: 3px; padding: 2px 8px; }
      .bar #toggle:hover { background: rgba(255,255,255,.12); }
      .bar #status.ok { color: #4ade80; }
      .bar #status.bad { color: #f87171; }
      /* The console fills the rest, exactly as it does inside the app window.
         Its surfaces are deliberately translucent — in the app they sit over the
         window (and your wallpaper). index.css forces `body{background:transparent
         !important}` for the Electron window, which in a browser means white
         shows through and everything reads washed out. So the harness supplies
         the ground the app window would. */
      #host { flex: 1 1 auto; min-height: 0; background: #1e1e1e; }
    </style>
  </head>
  <body>
    <div class="bar">
      <span class="t">Activity Console · design harness</span>
      <span class="note">real sessions from ~/.claude/projects · pane state inferred from transcript recency · context % and tok/s need the app</span>
      <button id="toggle" title="switch renderer (or press V)">view: timeline →</button>
      <span id="status">connecting…</span>
    </div>
    <div id="host"></div>
    <script type="module" src="./client.ts"></script>
  </body>
</html>
