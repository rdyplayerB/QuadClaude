<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self'">
    <title>Activity Console</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0e1013; overflow: hidden; }
      /* Positioned + stacked above the wallpaper dimming layer that
         ops-window.ts inserts as body's first child (that layer is fixed, so a
         statically-positioned #ops would paint underneath it). */
      #ops { height: 100%; position: relative; z-index: 1; }
    </style>
  </head>
  <body>
    <div id="ops"></div>
    <script type="module" src="/src/renderer/ops-window.ts"></script>
  </body>
</html>
