<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self'">
    <title>Activity Console</title>
    <style>
      /* No background here. When the user has a see-through window, main creates
         this one with transparent:true, and any colour painted at this level
         would sit on top of that and make the whole thing a solid slab.
         ops-window.ts sets the ground from the saved transparency instead. */
      html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
      /* Clip to the window's rounded corners: with transparent:true there is no
         native material shaping the window, so the content defines its shape. */
      html { border-radius: 12px; }
      #ops { height: 100%; position: relative; z-index: 1; }
    </style>
  </head>
  <body>
    <div id="ops"></div>
    <script type="module" src="/src/renderer/ops-window.ts"></script>
  </body>
</html>
